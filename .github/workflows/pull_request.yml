name: "[Checks] Pull Request"
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pushes the missing changeset to Renovate PRs; the push re-runs this workflow, so checks skip.
  renovate-sync:
    name: Renovate Sync
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      id-token: write
    uses: LedgerHQ/ledger-wallet-actions/.github/workflows/renovate-sync.yml@feat/renovate-sync
    with:
      renovate-login: gre-ledger
    secrets:
      GH_BOT_APP_ID: ${{ secrets.GH_BOT_APP_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}

  checks:
    name: CI
    needs: renovate-sync
    if: ${{ !cancelled() && needs.renovate-sync.outputs.dirty != 'true' }}
    runs-on: public-ledgerhq-shared-medium
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # CI is the required check, so a failed sync must fail it rather than let a bump merge without changeset.
      - name: Renovate sync failed
        if: needs.renovate-sync.result == 'failure'
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - uses: LedgerHQ/ts-libs/.github/actions/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Knip
        run: pnpm knip

      - name: Build
        run: pnpm build

      # Packs every library and asserts the tarball contains what package.json declares.
      # The root .gitignore hides lib/ and lib-es/ from `pnpm pack`, so a package without
      # a `files` allowlist silently declares an entry point that it does not ship.
      - name: Verify packaging
        run: pnpm verify-pack

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test & Coverage
        run: pnpm coverage

      - name: Aggregate coverage
        run: |
          > lcov.info
          printf '<testExecutions version="1">\n' > sonar-executionTests-report.xml
          for pkg in $(find ./libs -name "package.json" -not -path "*/node_modules/*"); do
            lib=$(dirname "$pkg")
            [ -f "$lib/coverage/lcov.info" ] && cat "$lib/coverage/lcov.info" >> lcov.info
            [ -f "$lib/coverage/sonar-executionTests-report.xml" ] && \
              sed '1d;$d' "$lib/coverage/sonar-executionTests-report.xml" >> sonar-executionTests-report.xml
          done
          printf '</testExecutions>\n' >> sonar-executionTests-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
