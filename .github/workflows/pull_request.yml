name: "[Checks] Pull Request"
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: CI
    runs-on: public-ledgerhq-shared-medium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Knip
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test & Coverage
        run: pnpm coverage

      - name: Aggregate coverage
        run: |
          > lcov.info
          printf '<testExecutions version="1">\n' > sonar-executionTests-report.xml
          for pkg in $(find ./libs -name "package.json" -not -path "*/node_modules/*"); do
            lib=$(dirname "$pkg")
            [ -f "$lib/coverage/lcov.info" ] && cat "$lib/coverage/lcov.info" >> lcov.info
            [ -f "$lib/coverage/sonar-executionTests-report.xml" ] && \
              sed '1d;$d' "$lib/coverage/sonar-executionTests-report.xml" >> sonar-executionTests-report.xml
          done
          printf '</testExecutions>\n' >> sonar-executionTests-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
