name: "[Release] Version Packages"
on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Maintain version pull request
    runs-on: public-ledgerhq-shared-medium
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write # JFrog OIDC login
    steps:
      # An app token is required rather than GITHUB_TOKEN: pull requests opened by
      # GITHUB_TOKEN do not trigger workflows, so the `CI` check that develop's
      # ruleset requires would never run and the version PR would be unmergeable.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Full history: @changesets/changelog-github resolves the commit that added
      # each changeset file to attribute the changelog entry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: LedgerHQ/ts-libs/.github/actions/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `publish-script` on purpose: with changesets present the action maintains
      # the `changeset-release/develop` pull request, and with none present it returns
      # early instead of publishing. Publishing happens from main in release.yml.
      #
      # Do not add a GITHUB_TOKEN env var here - the action throws if it is set and
      # differs from `github-token`. It injects the app token into the version script
      # itself, which is how changelog-github authenticates.
      - name: Create or update version pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
