name: "[Checks] SonarQube"

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    name: Scan
    runs-on: public-ledgerhq-shared-medium
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Coverage
        run: pnpm coverage

      - name: Aggregate coverage
        run: |
          > lcov.info
          printf '<testExecutions version="1">\n' > sonar-executionTests-report.xml
          for pkg in $(find ./libs -name "package.json" -not -path "*/node_modules/*"); do
            lib=$(dirname "$pkg")
            [ -f "$lib/coverage/lcov.info" ] && cat "$lib/coverage/lcov.info" >> lcov.info
            [ -f "$lib/coverage/sonar-executionTests-report.xml" ] && \
              sed '1d;$d' "$lib/coverage/sonar-executionTests-report.xml" >> sonar-executionTests-report.xml
          done
          printf '</testExecutions>\n' >> sonar-executionTests-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
