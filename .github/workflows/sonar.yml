name: "[Checks] SonarQube"

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    permissions:
      id-token: write
      contents: read
    name: Scan
    runs-on: public-ledgerhq-shared-medium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - uses: LedgerHQ/ts-libs/.github/actions/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Coverage
        run: pnpm coverage

      - name: Aggregate coverage
        run: |
          > lcov.info
          printf '<testExecutions version="1">\n' > sonar-executionTests-report.xml
          for pkg in $(find ./libs -name "package.json" -not -path "*/node_modules/*"); do
            lib=$(dirname "$pkg")
            [ -f "$lib/coverage/lcov.info" ] && cat "$lib/coverage/lcov.info" >> lcov.info
            [ -f "$lib/coverage/sonar-executionTests-report.xml" ] && \
              sed '1d;$d' "$lib/coverage/sonar-executionTests-report.xml" >> sonar-executionTests-report.xml
          done
          printf '</testExecutions>\n' >> sonar-executionTests-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
