name: "[Test] Sandbox Publish"
on:
  workflow_dispatch:
    inputs:
      registry:
        description: "npm registry host+path (no https://, no trailing slash). Defaults to ledgerlive-npm-sandbox-green."
        type: string
        required: false

env:
  FORCE_COLOR: "1"
  NPM_REGISTRY: ${{ inputs.registry || vars.NPM_SANDBOX_REGISTRY || 'jfrog.ledgerlabs.net/artifactory/api/npm/ledgerlive-npm-sandbox-green' }}

permissions:
  id-token: write
  contents: read

jobs:
  sandbox-publish:
    name: Build and Publish to JFrog sandbox
    runs-on: ${{ vars.RELEASE_RUNNER || 'public-ledgerhq-shared-medium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build libraries
        run: pnpm build

      - name: Login to JFrog (OIDC)
        id: jfrog-login
        uses: LedgerHQ/actions-security/actions/jfrog-login@5e1e158bc84b65cd0cb3b5b28733c3066ea93ed8 # actions/jfrog-login-1.4.1

      - name: Configure npm registry
        env:
          NPM_REGISTRY_TOKEN: ${{ steps.jfrog-login.outputs.oidc-token }}
        run: |
          REGISTRY="${NPM_REGISTRY#https://}"
          REGISTRY="${REGISTRY%/}"
          cat << EOF >> .npmrc
          registry=https://${REGISTRY}/
          //${REGISTRY}/:_authToken=${NPM_REGISTRY_TOKEN}
          EOF

      - name: Publish to sandbox (dist-tag=sandbox)
        run: pnpm exec changeset publish --tag sandbox
