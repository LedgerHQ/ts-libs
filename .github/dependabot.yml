version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    labels: ["dependencies"]
    open-pull-requests-limit: 15
    groups:
      # Only tooling is grouped. Everything else gets its own PR on purpose:
      # a lib dependency bump must be reviewable (and revertable) in isolation.
      tooling:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
          - "@commitlint/*"
          - "@jest/*"
          - "@nx/*"
          - "@swc/*"
          - "@types/*"
          - "eslint*"
          - "jest"
          - "jest-*"
          - "knip"
          - "msw"
          - "nx"
          - "ox*"
          - "prettier"
          - "ts-jest"
          - "typescript"
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    labels: ["dependencies", "github_actions"]
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
