min_version = "2026.4.8"

[settings]
experimental = true
lockfile = true
lockfile_platforms = [
  "linux-arm64",
  "linux-x64",
  "macos-arm64",
  "macos-x64",
  "windows-arm64",
  "windows-x64",
]

[tools]
node = "24.14.0"
pnpm = "11.13.1"
gitleaks = "8.30.1"
hk = "1.40.0"
pkl = "0.31.1"
actionlint = "v1.7.12"
zizmor = "v1.28.0"

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"
